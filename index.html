<style>
:root{--bg:#f1f3ef;--panel:#fff;--ink:#16201f;--mute:#5d6b69;--line:#cfd7d4;--acc:#176b82;--ok:#1b7a3d;--okbg:#dff3e5;--ko:#b3261e;--kobg:#fbe3e1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121719;--panel:#1b2225;--ink:#e6eceb;--mute:#93a3a0;--line:#2f3b3e;--acc:#5bb8d1;--ok:#7ddc9c;--okbg:#17321f;--ko:#ff8a80;--kobg:#3a1c1a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121719;--panel:#1b2225;--ink:#e6eceb;--mute:#93a3a0;--line:#2f3b3e;--acc:#5bb8d1;--ok:#7ddc9c;--okbg:#17321f;--ko:#ff8a80;--kobg:#3a1c1a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:480px;margin:0 auto;padding:12px}
h1{font-size:1.15rem;margin:0 0 4px}
p.sub{margin:0 0 14px;color:var(--mute);font-size:.9rem}
.credit{text-align:center;color:var(--mute);font-size:.8rem;margin:14px 0 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
label{display:block;font-size:.85rem;color:var(--mute);margin:8px 0 3px}
label:first-child{margin-top:0}
select,input{width:100%;font:inherit;font-size:1.2rem;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
select:focus,input:focus{outline:2px solid var(--acc);outline-offset:1px}
input[readonly]{font-weight:650;font-variant-numeric:tabular-nums}
.res{margin-top:10px;padding-top:4px;border-top:1px solid var(--line)}
.badge{margin-top:8px;padding:10px;border-radius:8px;font-size:1.25rem;font-weight:700;text-align:center;background:var(--bg);color:var(--mute)}
.badge.ok{background:var(--okbg);color:var(--ok)}
.badge.ko{background:var(--kobg);color:var(--ko)}
.badge small{display:block;font-size:.85rem;font-weight:400;margin-top:2px}
.msg{color:var(--ko);font-size:.9rem;min-height:1.2rem;margin-top:8px}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.m2{grid-template-columns:1fr 1fr;margin-bottom:8px}
.opts.m2 label{font-size:.95rem}
.xa{display:none;grid-template-columns:1fr 1fr;gap:8px;align-items:end}
.hint{margin:-2px 0 8px;font-size:.8rem;color:var(--mute)}
#p,#x,#l{border:2px solid var(--acc);padding:7px 11px}
#r{border-style:dashed;background:transparent}
:root{--x:#d9822b}
#x{border-color:var(--x)}
.sch{grid-column:1/-1;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.sch svg{display:block;width:100%;height:auto}
.leg{margin:6px 0 0;font-size:.78rem;color:var(--mute);line-height:1.35}
.la{color:var(--acc)}
.lx{color:var(--x)}
.bk{fill:none;stroke:var(--mute);stroke-width:2}
.da{fill:none;stroke:var(--acc);stroke-width:2}
.dx{fill:none;stroke:var(--x);stroke-width:2}
.dk{fill:none;stroke:var(--ink);stroke-width:1.6}
.ext{fill:none;stroke:var(--mute);stroke-width:1;stroke-dasharray:2 3}
.ta{fill:var(--acc);font:700 13px system-ui,sans-serif}
.tb{fill:var(--x);font:700 12px system-ui,sans-serif}
.tc{fill:var(--ink);font:600 11px system-ui,sans-serif}
.tri{fill:var(--x)}
.opts label{display:flex;align-items:center;justify-content:center;gap:6px;margin:0;padding:8px 0;font-size:1.2rem;color:var(--ink);border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer}
.opts label:has(input:checked){border-color:var(--acc);outline:1px solid var(--acc);font-weight:650}
.opts input{width:auto;padding:0;margin:0;accent-color:var(--acc);transform:scale(1.2)}
.blocks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.blk{display:block;margin:0;padding:8px 8px 4px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;color:var(--ink);font-size:1rem}
.blk:has(input:checked){border-color:var(--acc);outline:1px solid var(--acc)}
.bh{display:flex;align-items:center;gap:8px}
.bh b{font-size:.9rem}
.bh em{font-style:normal;color:var(--mute);font-size:.8rem;margin-left:auto;text-align:right}
.blk input{width:auto;padding:0;margin:0;accent-color:var(--acc);transform:scale(1.2)}
.blk svg{display:block;width:100%;height:auto;margin-top:6px}
.bd{fill:none;stroke:var(--mute);stroke-width:3}
.ct{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:10 3 2 3}
.ex{fill:none;stroke:var(--mute);stroke-width:1.4;stroke-dasharray:3 5}
.dm{fill:none;stroke:var(--ink);stroke-width:2.4}
.bm{fill:none;stroke:var(--acc);stroke-width:3;stroke-dasharray:9 5}
.pb{fill:var(--line);stroke:var(--ink);stroke-width:2.2}
.pl{fill:#2a9fd6}
.tk{fill:none;stroke:var(--ink);stroke-width:1.4}
.pd{fill:var(--ink)}
.tx{fill:var(--ink);font:650 20px system-ui,sans-serif}
.tx2{fill:var(--mute);font:15px system-ui,sans-serif;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.sk{fill:none;stroke:var(--ink);stroke-width:1.6}
.bd2{fill:none;stroke:var(--mute);stroke-width:2}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 6px}
.top h1{margin:0;font-size:1rem;flex:1;min-width:0}
.lang{display:flex;gap:4px}
.lang button{font:inherit;font-size:.8rem;font-weight:650;padding:5px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);cursor:pointer}
.lang button.on{background:var(--acc);border-color:var(--acc);color:var(--bg)}
</style>
</head>

  <h1 data-i="title"></h1>

  </div>

  <label id="tl" data-i="tl"></label>
  <div class="opts" id="angs" role="radiogroup" aria-labelledby="tl"></div>

  <div class="res">
    <label for="r" id="rl"></label>
    <input id="r" readonly placeholder="&#x2014;">
    <div class="msg" id="msg"></div>

  </div>
</div>

</main>

var TOL=2,RAGGIO=25,lang='it';

function t(k){return T[lang][k]}
function fmt(v,n){var s=v.toFixed(n);return lang==='en'?s:s.replace('.',',')}
function tr(){
  document.documentElement.lang=lang;document.title=t('title');
  Array.prototype.forEach.call(document.querySelectorAll('[data-i]'),function(e){e.textContent=t(e.getAttribute('data-i'))});

function calc(){
  var s=$('p').value.trim().replace(',','.'),m=$('msg'),b=$('badge'),r=$('r');
  m.textContent='';b.className='badge';
  var M=document.querySelector('input[name=m]:checked').value,isA=M==='a';
  $('xa').style.display=isA?'grid':'none';$('pl').style.display=$('p').style.display=isA?'none':'';
  $('rl').textContent=t('rl');
  var D=Number(document.querySelector('input[name=d]:checked').value),tt=Number(document.querySelector('input[name=t]:checked').value),a,p,wait=isA?t('wa'):t('wp');
  if(isA){
    var sx=$('x').value.trim().replace(',','.'),sl=$('l').value.trim().replace(',','.');
    if(sx===''||sl===''){r.value='';b.innerHTML=wait;return}
    var X=Number(sx),L=Number(sl);
    if(!isFinite(X)||!isFinite(L)||X<0||L<=0){r.value='';b.innerHTML=wait;m.textContent=t('nn');return}
    p=X+L;$('rl').textContent=t('rl')+' \u2013 A = '+fmt(p,1);
    if(p<=35){r.value='';b.innerHTML=t('nc');m.textContent=t('a35');return}
    a=Math.atan((p-35)/D)*180/Math.PI;
  }else{
    if(s===''){r.value='';b.innerHTML=wait;return}
    p=Number(s);
    if(!isFinite(p)||p<=0){r.value='';b.innerHTML=wait;m.textContent=t('np');return}
    var q=D/(p+RAGGIO);
    if(q>1){r.value='';b.innerHTML=t('nc');m.textContent=t('q1');return}
    a=Math.acos(q)*180/Math.PI;
  }
  var dev=a-tt,ok=Math.abs(dev)<=TOL+1e-9;
  r.value=fmt(a,2);
  b.className='badge '+(ok?'ok':'ko');
  b.innerHTML=(ok?t('ok'):t('ko'))+'<small>'+t('dev')+' '+(dev>=0?'+':'\u2212')+fmt(Math.abs(dev),2)+'\u00B0 ('+t('tol')+' \u00B1'+TOL+'\u00B0)</small>';
}
function angs(){
